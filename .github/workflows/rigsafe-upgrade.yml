name: RIGSAFE Upgrade Checks
on:
  push:
    branches: [upgrade/rigsafe-super-pro]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    outputs:
      version_code: ${{ steps.version.outputs.code }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.7'
          cache: true
      - uses: gradle/actions/setup-gradle@v5
      - id: version
        run: echo "code=$((1000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_OUTPUT"
      - run: flutter --version
      - run: flutter pub get
      - name: Analyze baseline
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Tests when present
        run: |
          if [ -d test ]; then flutter test; fi
      - name: Reuse existing app signing identity
        run: |
          mkdir -p ~/.android
          cp android/keystore/fixed_debug.p12 ~/.android/debug.keystore
      - name: Build current Android application
        run: flutter build apk --debug --build-number=${{ steps.version.outputs.code }}
      - uses: actions/upload-artifact@v4
        with:
          name: rigsafe-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 30

  android-device:
    if: contains(github.event.head_commit.message, '[device-check]')
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      APP_VERSION_CODE: ${{ needs.verify.outputs.version_code }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.7'
          cache: true
      - uses: gradle/actions/setup-gradle@v5
      - uses: actions/download-artifact@v4
        with:
          name: rigsafe-debug
          path: artifacts/current
      - uses: actions/download-artifact@v4
        with:
          name: rigsafe-debug
          run-id: 39051201748
          github-token: ${{ github.token }}
          path: artifacts/baseline
      - name: Reuse existing test signing identity
        run: |
          mkdir -p ~/.android
          cp android/keystore/fixed_debug.p12 ~/.android/debug.keystore
      - name: Enable KVM for isolated emulator runner
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify Android update and native backup
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash test/android_device_smoke.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rigsafe-device-evidence
          path: device-evidence/
          if-no-files-found: warn
          retention-days: 30
