name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_UPLOAD_KEY: ${{ secrets.UPLOAD_KEYSTORE_BASE64 != '' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - name: Install Dependencies
        run: flutter pub get
      - name: Flutter Analyze (non-blocking)
        run: flutter analyze || true
      - name: Use fixed signing key
        run: |
          mkdir -p ~/.android
          cp -f android/keystore/fixed_debug.p12 ~/.android/debug.keystore
      - name: Build APK
        run: flutter build apk --release --build-number=${{ github.run_number }} --no-shrink
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: saddam-rigging-az-master-calculator-apk
          path: build/app/outputs/flutter-apk/app-release.apk
      - name: Build Play Store AAB (upload key)
        if: env.HAS_UPLOAD_KEY == 'true'
        env:
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
          UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
          UPLOAD_KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
          UPLOAD_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
        run: |
          echo "$UPLOAD_KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
          {
            echo "storeFile=upload-keystore.jks"
            echo "storePassword=$UPLOAD_KEYSTORE_PASSWORD"
            echo "keyAlias=$UPLOAD_KEY_ALIAS"
            echo "keyPassword=$UPLOAD_KEY_PASSWORD"
          } > android/key.properties
          flutter build appbundle --release --build-number=${{ github.run_number }}
          rm -f android/key.properties android/app/upload-keystore.jks
      - name: Upload Play Store AAB
        if: env.HAS_UPLOAD_KEY == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: saddam-rigging-play-store-aab
          path: build/app/outputs/bundle/release/app-release.aab
