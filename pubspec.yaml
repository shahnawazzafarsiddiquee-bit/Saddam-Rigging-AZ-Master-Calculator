name: saddam_rigging_az_master_calculator
description: "Saddam Rigging A-Z Master Calculator - Master Lifting Calculator for rigging, crane planning and HSE."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  image_picker: any
  speech_to_text: any
  google_mlkit_text_recognition: any
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # Local database
  sqflite: ^2.3.3+1
  path: ^1.9.0
  path_provider: ^2.1.3

  # PDF generation & sharing
  pdf: ^3.10.8
  printing: ^5.12.0
  share_plus: ^9.0.0

  # QR code
  qr_flutter: ^4.1.0
  mobile_scanner: ^5.1.1

  # Utilities
  intl: ^0.19.0
  uuid: ^4.4.0
  file_picker: ^8.0.5
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/data/
