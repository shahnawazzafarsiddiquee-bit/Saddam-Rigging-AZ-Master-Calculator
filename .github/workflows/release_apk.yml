name: Publish APK Release

on:
  workflow_run:
    workflows: ["Build Android APK"]
    types: [completed]

permissions:
  contents: write
  actions: read

jobs:
  release:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download ${{ github.event.workflow_run.id }} --repo ${{ github.repository }} --dir out
          find out -name "*.apk" -o -name "*.aab"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk=$(find out -name "*.apk" | head -1)
          aab=$(find out -name "*.aab" | head -1)
          if [ -z "$apk" ]; then echo "APK nahi mili"; exit 1; fi
          assets=()
          cp "$apk" saddam-rigging.apk
          assets+=(saddam-rigging.apk)
          if [ -n "$aab" ]; then
            cp "$aab" saddam-rigging.aab
            assets+=(saddam-rigging.aab)
          fi
          gh release delete latest --repo ${{ github.repository }} --cleanup-tag --yes || true
          gh release create latest "${assets[@]}" --repo ${{ github.repository }} --target ${{ github.event.workflow_run.head_sha }} --title "Latest build ${{ github.event.workflow_run.run_number }} (APK + AAB)" --notes "Commit ${{ github.event.workflow_run.head_sha }}" --latest
