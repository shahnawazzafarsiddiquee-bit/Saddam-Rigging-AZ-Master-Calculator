name: Build Play Store AAB

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      UPLOAD_KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
      UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
      UPLOAD_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
      UPLOAD_KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
    steps:
      - name: Check signing secrets are configured
        run: |
          if [ -z "$UPLOAD_KEYSTORE_BASE64" ]; then
            echo "::error::Add the UPLOAD_KEYSTORE_BASE64, UPLOAD_KEYSTORE_PASSWORD, UPLOAD_KEY_PASSWORD and UPLOAD_KEY_ALIAS repository secrets (Settings > Secrets and variables > Actions) before running this workflow."
            exit 1
          fi
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - name: Install Dependencies
        run: flutter pub get
      - name: Decode upload keystore
        run: echo "$UPLOAD_KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
      - name: Write key.properties
        run: |
          cat > android/key.properties <<EOF
          storePassword=$UPLOAD_KEYSTORE_PASSWORD
          keyPassword=$UPLOAD_KEY_PASSWORD
          keyAlias=$UPLOAD_KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF
      - name: Build AAB
        run: flutter build appbundle --release --build-number=${{ github.run_number }}
      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: saddam-rigging-az-master-calculator-aab
          path: build/app/outputs/bundle/release/app-release.aab
