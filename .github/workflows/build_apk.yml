name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - name: Install Dependencies
        run: flutter pub get
      - name: Flutter Analyze (non-blocking)
        run: flutter analyze || true
      - name: Use fixed signing key
        run: |
          mkdir -p ~/.android
          cp -f android/keystore/fixed_debug.p12 ~/.android/debug.keystore
      - name: Build APK
        run: flutter build apk --release --build-number=${{ github.run_number }} --no-shrink
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: saddam-rigging-az-master-calculator-apk
          path: build/app/outputs/flutter-apk/app-release.apk
      - name: Build AAB
        run: flutter build appbundle --release --build-number=${{ github.run_number }}
      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: saddam-rigging-az-master-calculator-aab
          path: build/app/outputs/bundle/release/app-release.aab
