name: RIGSAFE Device Visual Checks
on:
  push:
    branches: [upgrade/rigsafe-super-pro]
    paths:
      - .github/workflows/rigsafe-visual.yml
      - integration_test/android_visual_test.dart
      - test/android_visual_driver.dart
      - test/android_device_smoke.sh
      - test/verify_android_png.py
permissions:
  contents: read
  actions: read
jobs:
  rendered-android:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      APP_VERSION_CODE: 1012
      VERIFY_VISIBLE_DASHBOARD: 1
      INTEGRATION_TARGET: integration_test/android_visual_test.dart
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.7'
          cache: true
      - uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: false
      # Test the actual delivered version-1012 artifacts. Only test code and
      # documentation changed after application commit 8388a0e.
      - uses: actions/download-artifact@v4
        with:
          name: rigsafe-debug
          run-id: 39092858778
          github-token: ${{ github.token }}
          path: artifacts/current
      - uses: actions/download-artifact@v4
        with:
          name: rigsafe-baseline-fixed-key
          run-id: 39092858778
          github-token: ${{ github.token }}
          path: artifacts/baseline
      - name: Enable isolated emulator KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify rendered Android screens
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash test/android_device_smoke.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rigsafe-rendered-screens
          path: device-evidence/
          if-no-files-found: error
          retention-days: 30
