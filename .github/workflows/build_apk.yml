name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - name: Install Dependencies
        run: flutter pub get
      - name: Flutter Analyze (non-blocking)
        run: flutter analyze || true
      - name: Use fixed signing key
        run: |
          mkdir -p ~/.android
          cp -f android/keystore/fixed_debug.p12 ~/.android/debug.keystore
      - name: Set up release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "KEYSTORE_BASE64 secret not set - building with the debug key."
            echo "Google Play will reject a debug-signed AAB; add the signing secrets before uploading."
            exit 0
          fi
          # Pasting a few KB of base64 by hand tends to wrap it, so drop any
          # whitespace before decoding.
          cleaned=$(printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]')
          # Shape only - never the value - so a truncated paste is obvious in a
          # log that masks the secret itself.
          echo "Keystore secret length: ${#cleaned}"
          if ! printf '%s' "$cleaned" | base64 -d > android/app/release-keystore.jks 2>/dev/null; then
            echo "::error::KEYSTORE_BASE64 is not valid base64 - re-copy the whole line into the secret."
            exit 1
          fi
          if ! keytool -list -keystore android/app/release-keystore.jks \
              -alias "$KEY_ALIAS" -storepass "$KEYSTORE_PASSWORD" > /dev/null 2>&1; then
            echo "::error::Keystore did not open with KEY_ALIAS and KEYSTORE_PASSWORD - check those secrets."
            exit 1
          fi
          {
            echo "storeFile=release-keystore.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties
          echo "Release signing configured."
      - name: Build APK
        run: flutter build apk --release --build-number=${{ github.run_number }} --no-shrink
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: saddam-rigging-az-master-calculator-apk
          path: build/app/outputs/flutter-apk/app-release.apk
      - name: Build AAB
        run: flutter build appbundle --release --build-number=${{ github.run_number }}
      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: saddam-rigging-az-master-calculator-aab
          path: build/app/outputs/bundle/release/app-release.aab
