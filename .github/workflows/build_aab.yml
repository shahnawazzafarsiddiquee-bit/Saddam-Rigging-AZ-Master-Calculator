name: Build Play Store AAB

on:
  workflow_dispatch:

jobs:
  missing-secrets:
    runs-on: ubuntu-latest
    if: ${{ secrets.UPLOAD_KEYSTORE_BASE64 == '' }}
    steps:
      - name: Explain missing secrets
        run: |
          echo "::error::Add the UPLOAD_KEYSTORE_BASE64, UPLOAD_KEYSTORE_PASSWORD, UPLOAD_KEY_PASSWORD and UPLOAD_KEY_ALIAS repository secrets (Settings > Secrets and variables > Actions) before running this workflow."
          exit 1

  build:
    runs-on: ubuntu-latest
    if: ${{ secrets.UPLOAD_KEYSTORE_BASE64 != '' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - name: Install Dependencies
        run: flutter pub get
      - name: Decode upload keystore
        run: |
          echo "${{ secrets.UPLOAD_KEYSTORE_BASE64 }}" | base64 -d > android/app/upload-keystore.jks
      - name: Write key.properties
        run: |
          cat > android/key.properties <<EOF
          storePassword=${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.UPLOAD_KEY_PASSWORD }}
          keyAlias=${{ secrets.UPLOAD_KEY_ALIAS }}
          storeFile=upload-keystore.jks
          EOF
      - name: Build AAB
        run: flutter build appbundle --release --build-number=${{ github.run_number }}
      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: saddam-rigging-az-master-calculator-aab
          path: build/app/outputs/bundle/release/app-release.aab
