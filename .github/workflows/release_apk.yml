name: Publish APK Release

on:
  workflow_run:
    workflows: ["Build Android APK"]
    types: [completed]

permissions:
  contents: write
  actions: read

jobs:
  release:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Download APK artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download ${{ github.event.workflow_run.id }} --repo ${{ github.repository }} --dir out
          find out -name "*.apk"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk=$(find out -name "*.apk" | head -1)
          if [ -z "$apk" ]; then echo "APK nahi mili"; exit 1; fi
          cp "$apk" saddam-rigging.apk
          gh release delete latest --repo ${{ github.repository }} --cleanup-tag --yes || true
          gh release create latest saddam-rigging.apk --repo ${{ github.repository }} --target ${{ github.event.workflow_run.head_sha }} --title "Latest APK (build ${{ github.event.workflow_run.run_number }})" --notes "Commit ${{ github.event.workflow_run.head_sha }}" --latest
